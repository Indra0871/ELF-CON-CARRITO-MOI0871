
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <title>e.l.f. Cosmetics - Carrito</title>
</head>

<body bgcolor="#121212" text="#FFFFFF" topmargin="0" leftmargin="0">

    <!-- ENCABEZADO -->
    <table border="0" width="100%" bgcolor="#1E1E1E" cellpadding="15" cellspacing="0">
        <tr>
            <td align="center">
                <font face="Montserrat, Arial, sans-serif" size="7" color="#FFB6C1">
                    <b>e . l . f . &nbsp;&nbsp; C O S M E T I C S</b>
                </font>
                <br>
                <font face="Montserrat, Arial, sans-serif" size="2" color="#DDDDDD">
                    MAQUILLAJE VEGANO &amp; CRUELTY-FREE
                </font>
            </td>
        </tr>
    </table>

    <!-- BARRA DE NAVEGACIÓN -->
    <table border="0" width="100%" bgcolor="#2D2D2D" cellpadding="15" cellspacing="0">
        <tr>
            <td align="center">
                <font face="Montserrat, Arial, sans-serif" size="2">

                    <a href="index.html" style="color:#FFB6C1; text-decoration:none;">
                        <b>INICIO</b>
                    </a>

                    &nbsp;&nbsp; | &nbsp;&nbsp;

                    <details style="display:inline-block;">
                        <summary style="color:#FFFFFF; cursor:pointer; display:inline;">
                            <b>CUENTA</b>
                        </summary>

                        <div style="position:absolute; background-color:#1E1E1E; padding:10px; z-index:10;">
                            <a href="login.html" style="display:block; color:white; text-decoration:none; padding:10px;">
                                INICIAR SESIÓN
                            </a>

                            <a href="registro.html" style="display:block; color:white; text-decoration:none; padding:10px;">
                                REGISTRO DE CLIENTES
                            </a>
                        </div>
                    </details>

                    &nbsp;&nbsp; | &nbsp;&nbsp;

                    <a href="carrito.html" style="color:#FFFFFF; text-decoration:none;">
                        <b>CARRITO (<span id="contadorCarrito">0</span>)</b>
                    </a>

                </font>
            </td>
        </tr>
    </table>

    <br><br>

    <!-- BOTÓN PARA REGRESAR A LA CATEGORÍA -->
    <center>
        <button type="button" onclick="regresarCategoria()"
            style="background-color:#2D2D2D; color:#FFB6C1; border:1px solid #800033; border-radius:8px; padding:10px 15px; cursor:pointer; font-family:Montserrat;">
            ← REGRESAR
    </center>

    <br><br>

    <center>
        <font face="Montserrat, Arial, sans-serif" size="6" color="#FFB6C1">
            <b>MI CARRITO</b>
        </font>
    </center>

    <br>

    <!-- TABLA DE PRODUCTOS -->
    <table border="0" width="90%" align="center" cellpadding="12" cellspacing="5" id="tablaCarrito">
    </table>

    <br>

    <center>
        <font face="Montserrat" size="4" color="#FFB6C1">
            <b id="totalCarrito">TOTAL: $0.00 MXN</b>
        </font>

        <br><br>

        <button type="button" onclick="vaciarCarrito()"
            style="background-color:#2D2D2D; color:white; border:1px solid #800033; border-radius:8px; padding:10px 15px; cursor:pointer; font-family:Montserrat;">
            VACIAR CARRITO
        </button>
    </center>

    <br><br>

    <!-- PIE DE PÁGINA -->
    <table border="0" width="100%" bgcolor="#1E1E1E" cellpadding="20">
        <tr>
            <td align="center">
                <font face="Montserrat, Arial, sans-serif" size="2" color="#AAAAAA">
                    Indra Jezabel Martinez Ortiz 5°J 0871
                </font>
            </td>
        </tr>
    </table>

    <!-- FUNCIONES DEL CARRITO -->
    <script>

        // Obtener los productos guardados
        function obtenerCarrito() {
            return JSON.parse(localStorage.getItem("carritoElf")) || [];
        }

        // Guardar los productos
        function guardarCarrito(carrito) {
            localStorage.setItem("carritoElf", JSON.stringify(carrito));
        }

        // Actualizar el contador
        function actualizarContador() {
            const carrito = obtenerCarrito();

            const cantidad = carrito.reduce(function(total, producto) {
                return total + producto.cantidad;
            }, 0);

            document.getElementById("contadorCarrito").textContent = cantidad;
        }

        // Mostrar los productos en la tabla
        function dibujarCarrito() {

            const carrito = obtenerCarrito();
            const tabla = document.getElementById("tablaCarrito");

            tabla.innerHTML = `
                <tr bgcolor="#2D2D2D">
                    <td align="center">
                        <font face="Montserrat" color="#FFB6C1"><b>PRODUCTO</b></font>
                    </td>

                    <td align="center">
                        <font face="Montserrat" color="#FFB6C1"><b>PRECIO</b></font>
                    </td>

                    <td align="center">
                        <font face="Montserrat" color="#FFB6C1"><b>CANTIDAD</b></font>
                    </td>

                    <td align="center">
                        <font face="Montserrat" color="#FFB6C1"><b>SUBTOTAL</b></font>
                    </td>

                    <td align="center">
                        <font face="Montserrat" color="#FFB6C1"><b>ACCIÓN</b></font>
                    </td>
                </tr>
            `;

            let total = 0;

            if (carrito.length === 0) {
                tabla.innerHTML += `
                    <tr>
                        <td colspan="5" align="center">
                            <font face="Montserrat" color="white">
                                Tu carrito está vacío.
                            </font>
                        </td>
                    </tr>
                `;
            }

            carrito.forEach(function(producto, indice) {

                const subtotal = producto.precio * producto.cantidad;

                total += subtotal;

                tabla.innerHTML += `
                    <tr bgcolor="#E6A3C2">

                        <td>
                            <font face="Montserrat" color="#121212">
                                ${producto.nombre}
                            </font>
                        </td>

                        <td align="center">
                            <font face="Montserrat" color="#121212">
                                $${producto.precio.toFixed(2)} MXN
                            </font>
                        </td>

                        <td align="center">
                            <button onclick="cambiarCantidad(${indice}, -1)">-</button>

                            <font face="Montserrat" color="#121212">
                                ${producto.cantidad}
                            </font>

                            <button onclick="cambiarCantidad(${indice}, 1)">+</button>
                        </td>

                        <td align="center">
                            <font face="Montserrat" color="#121212">
                                $${subtotal.toFixed(2)} MXN
                            </font>
                        </td>

                        <td align="center">
                            <button onclick="eliminarProducto(${indice})">
                                ELIMINAR
                            </button>
                        </td>

                    </tr>
                `;
            });

            document.getElementById("totalCarrito").textContent =
                "TOTAL: $" + total.toFixed(2) + " MXN";

            actualizarContador();
        }

        // Cambiar la cantidad de productos
        function cambiarCantidad(indice, cambio) {

            const carrito = obtenerCarrito();

            carrito[indice].cantidad += cambio;

            if (carrito[indice].cantidad <= 0) {
                carrito.splice(indice, 1);
            }

            guardarCarrito(carrito);

            dibujarCarrito();
        }

        // Eliminar un producto
        function eliminarProducto(indice) {

            const carrito = obtenerCarrito();

            carrito.splice(indice, 1);

            guardarCarrito(carrito);

            dibujarCarrito();
        }

        // Vaciar todo el carrito
        function vaciarCarrito() {

            if (confirm("¿Quieres eliminar todos los productos del carrito?")) {

                guardarCarrito([]);

                dibujarCarrito();
            }
        }

        // Regresar a la categoría anterior
        function regresarCategoria() {

            const categoria = localStorage.getItem("categoriaAnterior");

            if (categoria) {
                window.location.href = categoria;
            } else {
                window.location.href = "index.html";
            }
        }

        // Mostrar el carrito al abrir la página
        dibujarCarrito();

    </script>

</body>
</html>
